name: Collect station history

# Samples every station every 30 minutes until COLLECT_UNTIL, commits the rows
# to OUTPUT, then disables itself. Scheduled runs only fire on the default branch.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  OUTPUT: data/Oct15-16.csv
  COLLECT_UNTIL: "2026-10-17T04:00:00Z" # midnight Oct 16→17, Boston time (EDT)

permissions:
  contents: write # push the CSV
  actions: write # disable this workflow once the window ends

concurrency:
  group: collect-stations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the collection window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$COLLECT_UNTIL" +%s)" ]; then
            echo "Collection window ended at $COLLECT_UNTIL; disabling workflow."
            gh workflow disable "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.window.outputs.done != 'true'
        uses: actions/checkout@v5

      - if: steps.window.outputs.done != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Collect snapshot
        if: steps.window.outputs.done != 'true'
        run: bun run collect-stations.ts "$OUTPUT"

      # [skip netlify] keeps each data commit from triggering a Netlify deploy.
      - name: Commit and push
        if: steps.window.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git commit -m "Collect station snapshot [skip netlify]"
          git pull --rebase
          git push
